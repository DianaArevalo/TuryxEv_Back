name: CI - Tests

on:
  pull_request:
    branches: [ develop ]
    types: [ready_for_review]
  

jobs:
  test:
    runs-on: ubuntu-latest    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci   

      - name: Run tests
        run: npm test -- --coverage --runInBand
